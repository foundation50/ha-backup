name: GitHub Backup
version: "1.1.0"
slug: github_backup
description: Sync selected Home Assistant files and directories to a GitHub repository.
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
init: false
map:
  - config:rw
  - share:ro
  - ssl:ro
  - media:ro
options:
  repository: ""
  branch: main
  schedule: "0 3 * * *"
  whitelist: []
  backup_path: home-assistant
  run_on_startup: true
  github_token: ""
schema:
  repository: str
  branch: str
  schedule: str
  whitelist:
    - str
  backup_path: str
  run_on_startup: bool
  github_token: password
